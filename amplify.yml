version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install $(cat .nvmrc)
        - nvm use $(cat .nvmrc)
        - node -v
        - npm -v
        # Use the Node version pinned in .nvmrc so local + Amplify builds match
        # Quick visibility into declared deps (no jq in the build image)
        - node -p "JSON.stringify(require('./package.json').dependencies, null, 2)" || true
        - node -p "JSON.stringify(require('./package.json').devDependencies, null, 2)" || true
        # Deterministic install from package-lock.json (fails if lockfile is out of sync)
        - npm ci --no-audit --no-fund
        # Show the key resolved versions Amplify installed
        - npm ls react react-dom react-router react-scripts || true
    build:
      commands:
        # CRA treats warnings as errors in CI; CI=false prevents warning-only build failures in Amplify
        - echo "REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-<unset>}"
        - CI=false npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - ~/.npm/**/*
